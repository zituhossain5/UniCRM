services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${VALIDATION_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${VALIDATION_MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${VALIDATION_MINIO_PORT:-9100}:9000'
      - '${VALIDATION_MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    ports:
      - '${VALIDATION_MAILPIT_HTTP_PORT:-8125}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    ports:
      - '${VALIDATION_API_PORT:-4400}:4000'
    environment:
      APP_URL: https://crm.example.test
      CORS_ORIGINS: https://crm.example.test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${VALIDATION_STORAGE_S3_BUCKET:-unicrm-validation}
      STORAGE_S3_ACCESS_KEY_ID: ${VALIDATION_MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${VALIDATION_MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      EMAIL_DELIVERY_MODE: queue
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SESSION_COOKIE_SECURE: 'true'
      TRUSTED_PROXY_HOPS: '0'
      WORKER_ENABLED: 'false'
      INTEGRATION_SECRET_ENCRYPTION_KEY: ${VALIDATION_INTEGRATION_SECRET_ENCRYPTION_KEY:?Set VALIDATION_INTEGRATION_SECRET_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    environment:
      APP_URL: https://crm.example.test
      CORS_ORIGINS: https://crm.example.test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: ${VALIDATION_STORAGE_S3_BUCKET:-unicrm-validation}
      STORAGE_S3_ACCESS_KEY_ID: ${VALIDATION_MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${VALIDATION_MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      EMAIL_DELIVERY_MODE: queue
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      SESSION_COOKIE_SECURE: 'true'
      TRUSTED_PROXY_HOPS: '0'
      WORKER_ENABLED: 'true'
      INTEGRATION_SECRET_ENCRYPTION_KEY: ${VALIDATION_INTEGRATION_SECRET_ENCRYPTION_KEY:?Set VALIDATION_INTEGRATION_SECRET_ENCRYPTION_KEY}
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${VALIDATION_API_PORT:-4400}/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${VALIDATION_API_PORT:-4400}/api/v1
      NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-unicrm_csrf}
    ports:
      - '${VALIDATION_WEB_PORT:-3101}:3001'

  nginx:
    profiles: ['edge']

volumes:
  minio_data:
